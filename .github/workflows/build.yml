

name: Build Black Panther APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract project
        run: |
          unzip -q Black-Panther-Android-Studio-1.zip
          test -d black-panther-android

      - name: Build APK
        run: gradle -p black-panther-android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Black-Panther-APK
          path: black-panther-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
